name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Créer le projet Flutter
        run: flutter create --org com.damientv241 --project-name damien_tv_241 damien_tv_241
      - name: Copier le code de l'app
        run: cp app.dart damien_tv_241/lib/main.dart
      - name: Ajouter les dépendances
        working-directory: damien_tv_241
        run: flutter pub add video_player http shared_preferences cached_network_image wakelock_plus url_launcher
      - name: Remplacer AndroidManifest
        working-directory: damien_tv_241
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'XMLEOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:label="Damien TV 241"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          XMLEOF
      - name: Compiler l'APK
        working-directory: damien_tv_241
        run: flutter build apk --release
      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: damien-tv-241-apk
          path: damien_tv_241/build/app/outputs/flutter-apk/app-release.apk
