name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Installer les dépendances
        working-directory: damien_tv_241
        run: flutter pub get

      - name: Construire l'APK
        working-directory: damien_tv_241
        run: flutter build apk --release

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: damien-tv-241-apk
          path: damien_tv_241/build/app/outputs/flutter-apk/app-release.apk
