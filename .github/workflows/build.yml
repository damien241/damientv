name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Créer le projet Flutter
        run: flutter create --org com.damientv241 --project-name damien_tv_241 damien_tv_241
      - name: Copier le code de l'app
        run: cp app.dart damien_tv_241/lib/main.dart
      - name: Ajouter les dépendances
        working-directory: damien_tv_241
        run: flutter pub add video_player http shared_preferences cached_network_image
      - name: Modifier AndroidManifest
        working-directory: damien_tv_241
        run: |
          python3 << 'PYEOF'
          f = 'android/app/src/main/AndroidManifest.xml'
          c = open(f).read()
          if 'INTERNET' not in c:
              c = c.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          c = c.replace('android:label="damien_tv_241"', 'android:label="Damien TV 241"')
          if 'usesCleartextTraffic' not in c:
              c = c.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          open(f, 'w').write(c)
          print(open(f).read())
          PYEOF
      - name: Compiler l'APK
        working-directory: damien_tv_241
        run: flutter build apk --release
      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: damien-tv-241-apk
          path: damien_tv_241/build/app/outputs/flutter-apk/app-release.apk
