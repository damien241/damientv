name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Créer le projet Flutter
        run: flutter create --org com.damientv241 --project-name damien_tv_241 damien_tv_241
      - name: Copier le code
        run: cp app.dart damien_tv_241/lib/main.dart
      - name: Dépendances
        working-directory: damien_tv_241
        run: flutter pub add video_player http wakelock_plus
      - name: Autoriser internet
        working-directory: damien_tv_241
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="damien_tv_241"|android:label="Damien TV 241" android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
      - name: Compiler
        working-directory: damien_tv_241
        run: flutter build apk --release
      - name: Envoyer
        uses: actions/upload-artifact@v4
        with:
          name: damien-tv-241-apk
          path: damien_tv_241/build/app/outputs/flutter-apk/app-release.apk
